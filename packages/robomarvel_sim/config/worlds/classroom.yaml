# Виртуальный класс размером 8 x 6 метров.
# Все координаты в метрах: x растёт вправо, y - вверх.

name: classroom

start: {x: 1.0, y: 1.0, yaw: 0.0}

# Стены: [x1, y1, x2, y2]
walls:
  # внешний контур
  - [0.0, 0.0, 8.0, 0.0]
  - [8.0, 0.0, 8.0, 6.0]
  - [8.0, 6.0, 0.0, 6.0]
  - [0.0, 6.0, 0.0, 0.0]
  # внутренние перегородки
  - [3.0, 0.0, 3.0, 2.5]
  - [5.0, 6.0, 5.0, 3.5]
  # ниша у левой стены
  - [0.0, 4.5, 0.8, 4.5]

# Прямоугольная мебель: каждый прямоугольник превращается в 4 отрезка
boxes:
  - {x1: 1.0, y1: 3.6, x2: 2.2, y2: 4.2}   # парта 1
  - {x1: 5.6, y1: 0.8, x2: 6.8, y2: 1.4}   # парта 2
  - {x1: 6.4, y1: 4.4, x2: 7.0, y2: 5.0}   # тумба
  - {x1: 3.4, y1: 5.2, x2: 4.6, y2: 5.7}   # шкаф

# Круглые препятствия
circles:
  - {x: 4.0, y: 3.0, r: 0.15}   # колонна
  - {x: 1.8, y: 2.2, r: 0.12}   # стойка

# Предметы в помещении (они же - круглые препятствия)
objects:
  - {class: person, x: 7.0, y: 2.4, r: 0.25, height: 1.70, z: 0.0}
  - {class: chair,  x: 2.4, y: 1.2, r: 0.22, height: 0.90, z: 0.0}
  - {class: bottle, x: 4.4, y: 4.6, r: 0.05, height: 0.25, z: 0.0}
